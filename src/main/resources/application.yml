server:
  port: 8081

spring:
  application:
    name: resume-analyzer
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.2
      embedding:
        model: nomic-embed-text

app:
  resume-char-limit: 4000
  job-description-char-limit: 4000
  prompts:
    analyze: analyze-v2.st
    review: review-v1.st
  rag:
    enabled: true
    chunk-size: 400
    chunk-overlap: 80
    top-k: 5
  scraper:
    timeout-ms: 10000
    min-text-length: 80
    user-agent: ResumeAnalyzer/0.1 (+https://github.com/Jaaywaant/resume-analyzer; local learning project)
  tools:
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.jaywant.resumeanalyzer: INFO
