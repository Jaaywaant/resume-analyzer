services:
  ollama:
    image: ollama/ollama:latest
    container_name: resume-analyzer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: resume-analyzer-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling llama3.2..."
        ollama pull llama3.2
        echo "Pulling nomic-embed-text..."
        ollama pull nomic-embed-text
        echo "Models ready."
    restart: "no"

  app:
    build: .
    container_name: resume-analyzer-app
    ports:
      - "8081:8081"
    environment:
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SERVER_PORT: "8081"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_data:
